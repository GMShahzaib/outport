<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outport Documentation</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.png">
    <link rel="stylesheet" href="./index.css">
    <script src="./theme.js"></script>
</head>

<body>
    <header>
        <div class="header-content">
            <div class="flex-box">
                <div class="brand">
                    <img src="./assets/outport.png" alt="Logo" class="logo">
                    <h3 class="name">outport</h3>
                </div>

                <div class="header-actions">
                    <div id="playground-container" class="displayNon">
                        <button id="playground-btn" data-action="goToPlayground" class="primary-button">Playground</button>
                    </div>
                    <button type="button" class="theme-toggle" data-action="toggleTheme" title="Toggle theme" aria-label="Toggle color theme" aria-pressed="false">
                        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2"></path><path d="M12 20v2"></path>
                            <path d="M4.93 4.93l1.41 1.41"></path><path d="M17.66 17.66l1.41 1.41"></path>
                            <path d="M2 12h2"></path><path d="M20 12h2"></path>
                            <path d="M4.93 19.07l1.41-1.41"></path><path d="M17.66 6.34l1.41-1.41"></path>
                        </svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="title-container">
                <div class="title-wrapper">
                    <h1 id="title"></h1>
                    <span id="version" class="version"></span>
                </div>
                <p id="description"></p>
            </div>
            <div class="flex-box">
                <div class="base-url-container">
                    <div id="base-url-container" style="display: none;">
                        <p class="base-path">Base Path:</p>
                        <select id="baseUrlSelector" class="base-url-selector">
                        </select>
                    </div>
                </div>
            </div>
            <div class="flex-box">
                <div></div>
                <div>
                    <button id="globalHeadersBtn" class="primary-button displayNon" data-action="showModal">Headers</button>
                </div>
            </div>
        </div>
        <!-- The Modal -->
        <div id="myModal" class="modal" data-action="hideModal">
            <!-- Modal content -->

            <div class="modal-content" data-stop-propagation="true">
                <div class="flex-box">
                    <h3>Global Headers</h3>
                    <span class="close" data-action="hideModal">&times;</span>
                </div>
                <div id="globalHeaders" class="globe-headers-container"></div>
            </div>
        </div>
    </header>

    <main>
        <section>
            <div id="outport-ui"></div>
        </section>
    </main>
    <!-- Toast message component -->
    <div id="toast" class="toast-container">
        <p id="toast-text"></p>
        <button class="toast-close" data-action="hideToast">✖</button>
    </div>



    <script type="module" src="./outport-des-init.js"></script>
    <script type="module" src="./render-content.js"></script>
    <script src="./index.js"></script>
    <script src="./utils.js"></script>
    <script src="./services/httpClient.js"></script>
</body>

</html>
